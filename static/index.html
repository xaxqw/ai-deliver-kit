<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 应用交付控制台</title>
<style>
  :root{
    --bg:#F6F7F9; --card:#FFFFFF; --line:#E7E9EE; --line-2:#D6DAE1;
    --ink:#0F172A; --ink-2:#475569; --ink-3:#8A94A6;
    --brand:#1E3A5F; --accent:#2563EB; --accent-soft:#EFF5FF;
    --ok:#047857; --ok-bg:#ECFDF5; --ok-line:#A7F3D0;
    --warn:#B45309; --warn-bg:#FFFBEB; --warn-line:#FDE68A;
    --err:#B91C1C; --err-bg:#FEF2F2; --err-line:#FECACA;
    --r:14px; --sh:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.62;
  }
  .shell{max-width:1000px;margin:0 auto;padding:0 24px 64px}

  /* 顶栏 */
  .top{display:flex;align-items:center;gap:14px;padding:26px 0 22px}
  .mark{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(145deg,#24456F,#16304F);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(30,58,95,.25);
  }
  .t1{font-size:16.5px;font-weight:600}
  .t2{font-size:12.5px;color:var(--ink-3);margin-top:1px}
  .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  select{
    font:inherit;font-size:12.5px;color:var(--ink-2);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;
    cursor:pointer;outline:none;box-shadow:var(--sh);
  }
  select:focus{border-color:#C3D3EC}
  .dot{width:7px;height:7px;border-radius:50%;background:#10B981;
       box-shadow:0 0 0 3px rgba(16,185,129,.15)}

  /* 操作区 */
  .acts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
  .act{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 12px;cursor:pointer;font:inherit;text-align:left;
    box-shadow:var(--sh);transition:all .16s;
  }
  .act:hover{border-color:#C3D3EC;transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,24,40,.07)}
  .act:disabled{opacity:.45;cursor:default;transform:none;box-shadow:var(--sh)}
  .act .nm{font-size:13.5px;font-weight:600;display:block;margin-bottom:3px}
  .act .ds{font-size:11.5px;color:var(--ink-3);line-height:1.5}
  .act.primary{background:var(--brand);border-color:var(--brand)}
  .act.primary .nm,.act.primary .ds{color:#fff}
  .act.primary .ds{color:rgba(255,255,255,.72)}
  .act.primary:hover{background:#16294A}

  /* 结果 */
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;box-shadow:var(--sh);margin-bottom:16px;
    animation:rise .2s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .p-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .p-title{font-size:15px;font-weight:600}
  .p-time{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  .verdict{
    display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;
    font-size:13.5px;font-weight:500;margin-bottom:16px;
  }
  .verdict.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
  .verdict.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
  .verdict.err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line)}

  /* 体检网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
  .chk{
    border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    border-left-width:3px;background:#fff;
  }
  .chk.ok{border-left-color:#10B981}
  .chk.warn{border-left-color:#F59E0B}
  .chk.fail{border-left-color:#EF4444}
  .chk .n{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .chk .v{font-size:12.8px;color:var(--ink-2);line-height:1.55;word-break:break-all}
  .chk .a{font-size:11.5px;color:var(--warn);margin-top:6px}
  .pill{
    font-size:10.5px;padding:1px 7px;border-radius:999px;font-weight:500;
  }
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.fail{background:var(--err-bg);color:var(--err)}

  /* 步骤 / 时间轴 */
  .steps{display:flex;flex-direction:column;gap:0}
  .step{display:flex;gap:12px;padding:9px 0;position:relative}
  .step:not(:last-child)::before{
    content:"";position:absolute;left:5px;top:26px;bottom:-9px;width:1px;background:var(--line);
  }
  .step .bul{width:11px;height:11px;border-radius:50%;flex:none;margin-top:6px;background:#fff;border:2px solid}
  .step.ok .bul{border-color:#10B981;background:#10B981}
  .step.warn .bul{border-color:#F59E0B;background:#F59E0B}
  .step.fail .bul{border-color:#EF4444;background:#EF4444}
  .step .nm{font-size:13px;font-weight:500;min-width:88px}
  .step .dt{font-size:12.5px;color:var(--ink-2);flex:1}
  .step .ms{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}

  /* 评测 */
  .bigro{display:flex;align-items:flex-end;gap:26px;margin-bottom:20px;flex-wrap:wrap}
  .bignum{font-size:50px;font-weight:600;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
  .bignum small{font-size:22px;font-weight:500;color:var(--ink-3);margin-left:2px}
  .bignum .lb{font-size:12px;color:var(--ink-3);font-weight:400;letter-spacing:0;display:block;margin-top:8px}
  .kv{display:flex;gap:26px}
  .kv div{font-size:12px;color:var(--ink-3)}
  .kv b{display:block;font-size:17px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  .bar{margin-bottom:11px}
  .bar .h{display:flex;font-size:12.5px;margin-bottom:5px}
  .bar .h span:last-child{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .track{height:7px;background:#F1F3F6;border-radius:99px;overflow:hidden}
  .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#3B82F6,#1D4ED8);transition:width .5s ease}

  /* 报告列表 */
  .reports{margin-top:26px}
  .rep-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .rep-h h3{font-size:13px;font-weight:600;color:var(--ink-2)}
  .rep-h .cnt{font-size:11.5px;color:var(--ink-3)}
  .rep-h button{
    margin-left:auto;font:inherit;font-size:12px;color:var(--accent);
    background:var(--accent-soft);border:1px solid #D5E4FB;border-radius:7px;
    padding:5px 11px;cursor:pointer;
  }
  .rep-h button:hover{background:#E4EEFF}
  .rl{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .ri{
    display:flex;align-items:center;gap:10px;background:#fff;padding:11px 15px;
    cursor:pointer;transition:background .14s;
  }
  .ri:hover{background:#FAFBFC}
  .ri .n{font-size:13px}
  .ri .m{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .ri .go{font-size:11.5px;color:var(--accent)}

  /* 弹层 */
  .modal{
    position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;
    display:none;align-items:center;justify-content:center;padding:28px;
  }
  .modal.show{display:flex}
  .modal-box{
    background:#fff;border-radius:14px;width:100%;max-width:820px;
    max-height:82vh;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(15,23,42,.3);
  }
  .modal-bar{
    display:flex;align-items:center;gap:10px;padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  .modal-bar .n{font-size:13.5px;font-weight:500}
  .modal-bar button{
    margin-left:auto;font:inherit;font-size:12px;background:#F3F4F6;border:0;
    border-radius:7px;padding:5px 12px;cursor:pointer;color:var(--ink-2);
  }
  .modal-body{padding:22px 26px;overflow:auto;font-size:13.5px;color:var(--ink-2);line-height:1.75}
  .modal-body h2{font-size:18px;color:var(--ink);margin:0 0 14px;font-weight:600}
  .modal-body h3{font-size:15px;color:var(--ink);margin:22px 0 10px;font-weight:600}
  .modal-body h4{font-size:13.5px;color:var(--ink);margin:16px 0 8px;font-weight:600}
  .modal-body table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
  .modal-body th{background:#FAFBFC;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink-2);font-weight:600}
  .modal-body td{padding:7px 10px;border-bottom:1px solid #F3F4F6}
  .modal-body code{background:#F3F5F8;border-radius:4px;padding:1px 5px;font-size:12px}
  .modal-body ul{margin:8px 0 8px 20px}
  .modal-body hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  .modal-body p{margin:8px 0}

  /* 加载 */
  .load{padding:26px 22px}
  .load .txt{font-size:13.5px;color:var(--ink-2);margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .spin{
    width:15px;height:15px;border-radius:50%;border:2px solid #DFE4EC;
    border-top-color:var(--brand);animation:rot .75s linear infinite;flex:none;
  }
  @keyframes rot{to{transform:rotate(360deg)}}
  .ptrack{height:4px;background:#F1F3F6;border-radius:99px;overflow:hidden}
  .pfill{height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .4s ease}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:9px}

  .errbox{background:var(--err-bg);border:1px solid var(--err-line);border-radius:10px;padding:14px 16px}
  .errbox .t{font-size:13px;font-weight:500;color:var(--err);margin-bottom:5px}
  .errbox pre{font-size:11.5px;color:var(--ink-2);white-space:pre-wrap;font-family:monospace}
  .ops{display:flex;align-items:center;gap:8px;margin:-6px 0 18px;font-size:12px;flex-wrap:wrap}
  .ops .lb{color:var(--ink-3);font-size:11.5px}
  .op{
    font:inherit;font-size:12px;color:var(--ink-2);background:var(--card);
    border:1px solid var(--line);border-radius:7px;padding:5px 11px;
    cursor:pointer;transition:all .14s;
  }
  .op:hover{border-color:#C3D3EC;color:var(--accent)}
  .op:disabled{opacity:.45;cursor:default}
  .ops .info{margin-left:auto;color:var(--ink-3);font-size:11.5px}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="mark">
      <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
        <path d="M3 15.5L8 9.5L12 12.5L18 4.5" stroke="#CFE0F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="4.5" r="2" fill="#fff"/>
      </svg>
    </div>
    <div>
      <div class="t1">AI 应用交付控制台</div>
      <div class="t2">环境体检 · 离线打包 · 部署验证 · 效果评测</div>
    </div>
    <div class="right">
      <select id="target"></select>
      <span class="dot"></span>
    </div>
  </header>

  <section class="acts">
    <button class="act" data-act="check"><span class="nm">环境体检</span><span class="ds">12 项检查<br>约 1 秒</span></button>
    <button class="act" data-act="bundle"><span class="nm">离线打包</span><span class="ds">安装脚本 + 哈希<br>约 1 秒</span></button>
    <button class="act" data-act="smoke"><span class="nm">部署验证</span><span class="ds">端到端调用<br>约 5 秒</span></button>
    <button class="act" data-act="eval"><span class="nm">效果评测</span><span class="ds">跑测试集<br>约 70 秒</span></button>
    <button class="act primary" data-act="all"><span class="nm">完整交付</span><span class="ds">全流程 + 验收报告<br>约 80 秒</span></button>
  </section>

  <div class="ops">
    <span class="lb">运维</span>
    <button class="op" data-act="patrol">持续巡检</button>
    <button class="op" data-act="snapshot">创建快照</button>
    <button class="op" data-act="rollback">回滚预演</button>
    <span class="info" id="snapInfo"></span>
  </div>

  <div id="out"></div>

  <section class="reports">
    <div class="rep-h">
      <h3>生成的报告</h3><span class="cnt" id="rcnt"></span>
      <button id="openDir">打开输出目录</button>
    </div>
    <div id="reports"><div class="rl"><div class="ri"><span class="n" style="color:#8A94A6">还没有报告，先跑一次检查</span></div></div></div>
  </section>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-bar"><span class="n" id="mTitle"></span><button id="mClose">关闭</button></div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const out = $("out");
let targets = [], current = "";

const esc = s => String(s ?? "")
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const ACT_LABEL = {check:"环境体检", bundle:"离线打包", smoke:"部署验证", eval:"效果评测", all:"完整交付流程"};
const ACT_EST   = {check:1, bundle:2, smoke:6, eval:70, all:85};

/* ---------- 目标应用 ---------- */
async function loadTargets(){
  const r = await fetch("/api/targets");
  const d = await r.json();
  targets = d.targets || [];
  const sel = $("target");
  sel.innerHTML = targets.map(t =>
    `<option value="${esc(t.file)}">${esc(t.name)} · v${esc(t.version)}</option>`).join("");
  if (targets.length) current = targets[0].file;
  sel.onchange = () => { current = sel.value; };
}

/* ---------- 报告列表 ---------- */
async function loadReports(){
  const r = await fetch("/api/reports");
  const d = await r.json();
  const list = d.reports || [];
  $("rcnt").textContent = list.length ? `${list.length} 份` : "";
  const box = $("reports");
  if (!list.length){
    box.innerHTML = '<div class="rl"><div class="ri"><span class="n" style="color:#8A94A6">还没有报告，先跑一次检查</span></div></div>';
    return;
  }
  box.innerHTML = '<div class="rl">' + list.map(f =>
    `<div class="ri" data-name="${esc(f.name)}">
       <span class="n">${esc(f.name.replace(/^retail-nl2sql-/, "").replace(".md",""))}</span>
       <span class="m">${esc(f.mtime)}</span>
       <span class="go">查看</span>
     </div>`).join("") + '</div>';
  box.querySelectorAll(".ri").forEach(el => {
    el.onclick = () => openReport(el.dataset.name);
  });
}

async function openReport(name){
  const r = await fetch("/api/report?name=" + encodeURIComponent(name));
  const d = await r.json();
  if (d.error){ alert(d.error); return; }
  $("mTitle").textContent = name;
  $("mBody").innerHTML = md2html(d.content);
  $("modal").classList.add("show");
}

/* ---------- 极简 Markdown ---------- */
function md2html(src){
  let s = esc(src);
  s = s.replace(/^\|(.+)\|\s*$/gm, m => m);            // 保底
  // 表格
  s = s.replace(/(^\|.+\|\s*\n\|[\s:|-]+\|\s*\n(?:\|.*\|\s*\n?)*)/gm, block => {
    const lines = block.trim().split("\n");
    const head = lines[0].split("|").slice(1,-1).map(x=>`<th>${x.trim()}</th>`).join("");
    const rows = lines.slice(2).map(l =>
      "<tr>" + l.split("|").slice(1,-1).map(x=>`<td>${x.trim()}</td>`).join("") + "</tr>").join("");
    return `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  s = s.replace(/^### (.+)$/gm, "<h4>$1</h4>");
  s = s.replace(/^## (.+)$/gm, "<h3>$1</h3>");
  s = s.replace(/^# (.+)$/gm, "<h2>$1</h2>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/^---$/gm, "<hr>");
  s = s.replace(/(?:^- .+$\n?)+/gm, m =>
    "<ul>" + m.trim().split("\n").map(l => `<li>${l.replace(/^- /,"")}</li>`).join("") + "</ul>");
  s = s.split(/\n{2,}/).map(p => {
    const t = p.trim();
    if (!t) return "";
    return /^<(h2|h3|h4|table|ul|hr|p)/.test(t) ? t : `<p>${t.replace(/\n/g,"<br>")}</p>`;
  }).join("\n");
  return s;
}

/* ---------- 加载态 ---------- */
let timer = null;
function showLoading(name){
  const est = ACT_EST[name] || 5;
  out.innerHTML = `
    <div class="panel load">
      <div class="txt"><span class="spin"></span>正在执行「${ACT_LABEL[name] || name}」…</div>
      <div class="ptrack"><div class="pfill" id="pf"></div></div>
      <div class="hint" id="ph">预计 ${est} 秒</div>
    </div>`;
  const t0 = Date.now();
  let p = 0;
  timer = setInterval(() => {
    const el = (Date.now() - t0) / 1000;
    // 伪进度：越来越慢地逼近 92%，避免让人以为卡死
    p = Math.min(92, p + (92 - p) * 0.06 + 0.4);
    const pf = $("pf"), ph = $("ph");
    if (pf) pf.style.width = p.toFixed(1) + "%";
    if (ph) ph.textContent = `已用 ${el.toFixed(0)} 秒 · 预计 ${est} 秒`;
  }, 400);
}
function stopLoading(){ if (timer){ clearInterval(timer); timer = null; } }

/* ---------- 渲染 ---------- */
function renderCheck(r){
  const s = r.summary;
  const cls = s.fail > 0 ? "err" : (s.warn > 0 ? "warn" : "ok");
  const txt = s.fail > 0
    ? `存在 ${s.fail} 项阻塞，处理后可部署`
    : (s.warn > 0 ? `${s.warn} 项警告，可部署但需注意` : "环境就绪，可以部署");
  let h = `<div class="panel">
    <div class="p-head"><span class="p-title">环境体检</span>
      <span class="p-time">${s.ok} 通过 / ${s.warn} 警告 / ${s.fail} 失败</span></div>
    <div class="verdict ${cls}">${txt}</div>
    <div class="grid">`;
  r.checks.forEach(c => {
    h += `<div class="chk ${c.status}">
      <div class="n"><span class="pill ${c.status}">${c.status==="ok"?"通过":c.status==="warn"?"警告":"失败"}</span>${esc(c.name)}</div>
      <div class="v">${esc(c.detail)}</div>
      ${c.advice && c.status!=="ok" ? `<div class="a">建议：${esc(c.advice)}</div>` : ""}
    </div>`;
  });
  h += "</div></div>";
  out.innerHTML = h;
}

function renderSteps(title, steps, verdictText, ok){
  let h = `<div class="panel">
    <div class="p-head"><span class="p-title">${title}</span></div>`;
  if (verdictText) h += `<div class="verdict ${ok?"ok":"err"}">${verdictText}</div>`;
  h += '<div class="steps">';
  steps.forEach(s => {
    h += `<div class="step ${s.status}">
      <div class="bul"></div>
      <div class="nm">${esc(s.name)}</div>
      <div class="dt">${esc(s.detail || "")}</div>
      <div class="ms">${esc(s.ms || "—")}</div>
    </div>`;
  });
  h += "</div></div>";
  out.innerHTML = h;
  if (ok){
    loadReports();
    const name = current.replace(".json","") ;
    fetch("/api/reports").then(r=>r.json()).then(d=>{
      const hit = (d.reports||[]).find(x => x.name.includes("delivery") || x.name.includes("smoke"));
      if (hit) openReport(hit.name);
    });
  }
}

function renderEval(r){
  const s = r.summary;
  let h = `<div class="panel">
    <div class="p-head"><span class="p-title">效果评测</span>
      <span class="p-time">${s.total} 条用例 · 用时 ${s.wall_s}s</span></div>
    <div class="bigro">
      <div class="bignum">${(s.accuracy*100).toFixed(1)}<small>%</small>
        <span class="lb">准确率</span></div>
      <div class="kv">
        <div><b>${(s.p50_ms/1000).toFixed(2)}s</b>P50 延迟</div>
        <div><b>${(s.p95_ms/1000).toFixed(2)}s</b>P95 延迟</div>
        <div><b>${s.passed}/${s.total}</b>通过</div>
      </div>
    </div><div>`;
  Object.entries(s.by_category || {}).forEach(([cat, v]) => {
    const p = v.passed / Math.max(v.total,1) * 100;
    h += `<div class="bar">
      <div class="h"><span>${esc(cat)}</span><span>${v.passed}/${v.total} · ${p.toFixed(1)}%</span></div>
      <div class="track"><div class="fill" style="width:${p}%"></div></div>
    </div>`;
  });
  h += "</div>";
  if ((r.failures||[]).length){
    h += `<div style="margin-top:18px"><div style="font-size:12px;color:#8A94A6;margin-bottom:8px">未通过用例</div>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <tr style="color:#8A94A6;text-align:left"><th style="padding:6px 10px;font-weight:500">编号</th>
      <th style="padding:6px 10px;font-weight:500">问题</th>
      <th style="padding:6px 10px;font-weight:500">期望</th>
      <th style="padding:6px 10px;font-weight:500">实际</th></tr>`;
    r.failures.forEach(f => {
      h += `<tr><td style="padding:6px 10px;border-top:1px solid #F3F4F6">${esc(f.id)}</td>
        <td style="padding:6px 10px;border-top:1px solid #F3F4F6">${esc(f.question)}</td>
        <td style="padding:6px 10px;border-top:1px solid #F3F4F6">${esc(f.expect)}</td>
        <td style="padding:6px 10px;border-top:1px solid #F3F4F6;color:#B45309">${esc(f.status)}</td></tr>`;
    });
    h += "</table></div>";
  }
  h += "</div>";
  out.innerHTML = h;
  loadReports();
}

function renderAll(r){
  const e = r.result;
  const allOk = e.env_ready && e.smoke.passed;
  let h = `<div class="panel">
    <div class="p-head"><span class="p-title">完整交付流程</span></div>
    <div class="verdict ${allOk?"ok":"err"}">${allOk ? "验收通过 · 报告已生成" : "存在未通过项，需整改"}</div>
    <div class="grid">
      <div class="chk ${e.env_ready?"ok":"fail"}">
        <div class="n"><span class="pill ${e.env_ready?"ok":"fail"}">${e.env_ready?"通过":"未通过"}</span>环境检查</div>
        <div class="v">${e.env.ok} 通过 / ${e.env.warn} 警告 / ${e.env.fail} 失败</div>
      </div>
      <div class="chk ${e.smoke.passed?"ok":"fail"}">
        <div class="n"><span class="pill ${e.smoke.passed?"ok":"fail"}">${e.smoke.passed?"通过":"未通过"}</span>部署验证</div>
        <div class="v">${e.smoke.steps.filter(s=>s.status==="ok").length}/${e.smoke.steps.length} 步通过</div>
      </div>
      <div class="chk ok">
        <div class="n"><span class="pill ok">已执行</span>效果评测</div>
        <div class="v">准确率 ${(e.eval.accuracy*100).toFixed(1)}%，P95 ${(e.eval.p95_ms/1000).toFixed(2)}s</div>
      </div>
      <div class="chk ok">
        <div class="n"><span class="pill ok">已生成</span>离线部署包</div>
        <div class="v">${esc(e.bundle.zip || "—")}</div>
      </div>
    </div></div>`;
  out.innerHTML = h;
  loadReports();
  setTimeout(() => openReport(r.report), 300);
}

/* ---------- 流式评测 ---------- */
async function runEvalStream(){
  document.querySelectorAll(".act, .op").forEach(b => b.disabled = true);
  const url = `/api/eval/stream?target=${encodeURIComponent(current || "retail-nl2sql.json")}`;
  const t0 = Date.now();

  out.innerHTML = `
    <div class="panel">
      <div class="p-head"><span class="p-title">效果评测</span>
        <span class="p-time" id="evProg">正在连接…</span></div>
      <div class="ptrack"><div class="pfill" id="evBar" style="width:0"></div></div>
      <div class="bigro" style="margin-top:20px">
        <div class="bignum"><span id="evAcc">—</span><small>%</small>
          <span class="lb">实时准确率</span></div>
        <div class="kv">
          <div><b id="evPass">0</b>通过</div>
          <div><b id="evDone">0</b>已完成</div>
          <div><b id="evAvg">—</b>平均耗时</div>
        </div>
      </div>
      <div id="evList" style="max-height:300px;overflow:auto;border-top:1px solid #F1F3F6;padding-top:6px"></div>
    </div>`;

  const listEl = () => $("evList");
  let msSum = 0, nSum = 0;

  try{
    const resp = await fetch(url);
    if (!resp.ok || !resp.body) throw new Error("流式接口不可用");
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});

      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let ev = "message", data = "";
        chunk.split("\n").forEach(line => {
          if (line.startsWith("event: ")) ev = line.slice(7).trim();
          else if (line.startsWith("data: ")) data = line.slice(6);
        });
        if (!data) continue;
        let o; try { o = JSON.parse(data); } catch(e){ continue; }

        if (ev === "progress"){
          nSum++; msSum += o.ms || 0;
          const acc = (o.running_accuracy * 100).toFixed(1);
          $("evProg").textContent = `${o.index} / ${o.total} · 已用 ${((Date.now()-t0)/1000).toFixed(0)}s`;
          $("evBar").style.width = (o.index / o.total * 100).toFixed(1) + "%";
          $("evAcc").textContent = acc;
          $("evPass").textContent = o.running_passed;
          $("evDone").textContent = o.index;
          $("evAvg").textContent = (msSum / nSum / 1000).toFixed(2) + "s";

          const row = document.createElement("div");
          row.style.cssText = "display:flex;gap:10px;font-size:12px;padding:5px 2px;border-bottom:1px solid #FAFBFC;color:#475569";
          row.innerHTML =
            `<span style="width:52px;color:${o.pass ? "#047857" : "#B91C1C"};font-weight:500">${o.pass ? "通过" : "未过"}</span>
             <span style="width:56px;color:#8A94A6">${esc(o.id)}</span>
             <span style="flex:1">${esc(o.question)}</span>
             <span style="width:64px;text-align:right;color:#8A94A6">${(o.ms/1000).toFixed(2)}s</span>`;
          listEl().appendChild(row);
          listEl().scrollTop = listEl().scrollHeight;
        }
        else if (ev === "summary"){
          const s = o.summary;
          $("evAcc").textContent = (s.accuracy * 100).toFixed(1);
          $("evPass").textContent = `${s.passed}/${s.total}`;
          $("evDone").textContent = s.total;
          $("evAvg").textContent = (s.avg_ms / 1000).toFixed(2) + "s";
          $("evProg").textContent = `完成 · P50 ${(s.p50_ms/1000).toFixed(2)}s · P95 ${(s.p95_ms/1000).toFixed(2)}s · ${s.wall_s}s`;
          $("evBar").style.width = "100%";
          if ((o.failures || []).length){
            const h = document.createElement("div");
            h.style.cssText = "margin-top:12px;font-size:12px;color:#B45309";
            h.textContent = `未通过 ${o.failures.length} 条：`
              + o.failures.map(f => `${f.id}（期望 ${f.expect}，实际 ${f.status}）`).join("；");
            listEl().appendChild(h);
          }
        }
        else if (ev === "report"){
          loadReports();
        }
        else if (ev === "error"){
          throw new Error(o.error || "评测失败");
        }
      }
    }
  }catch(e){
    out.innerHTML = `<div class="panel"><div class="errbox">
      <div class="t">评测中断</div><pre>${esc(e.message)}</pre></div></div>`;
  }finally{
    document.querySelectorAll(".act, .op").forEach(b => b.disabled = false);
  }
}

function renderPatrol(res){
  const s = res.summary;
  const cls = (s.success_rate === 1 && s.verdict === "稳定") ? "ok"
            : (s.success_rate >= 0.8 ? "warn" : "err");
  let h = `<div class="panel">
    <div class="p-head"><span class="p-title">持续巡检</span>
      <span class="p-time">${s.count} 次 · 间隔 ${s.interval}s</span></div>
    <div class="verdict ${cls}">成功率 ${(s.success_rate*100).toFixed(0)}% ·
      平均 ${s.avg_ms}ms · 最大 ${s.max_ms}ms · 波动 ${s.jitter_pct}% · ${s.verdict}</div>
    <div class="steps">`;
  res.records.forEach(rec => {
    h += `<div class="step ${rec.status}">
      <div class="bul"></div>
      <div class="nm">${esc(rec.ts)}</div>
      <div class="dt">${esc(rec.detail)}</div>
      <div class="ms">${rec.ms ? rec.ms + "ms" : "—"}</div></div>`;
  });
  h += "</div></div>";
  out.innerHTML = h;
}

function renderSnapshot(res){
  if (!res.ok){
    out.innerHTML = `<div class="panel"><div class="errbox"><div class="t">快照失败</div>
      <pre>${esc(res.error || "")}</pre></div></div>`;
    return;
  }
  out.innerHTML = `<div class="panel">
    <div class="p-head"><span class="p-title">代码快照</span>
      <span class="p-time">${esc(res.id)}</span></div>
    <div class="verdict ok">已保存 ${res.file_count} 个文件 · ${res.size_kb} KB</div>
    <div style="font-size:12px;color:#8A94A6;word-break:break-all">${esc(res.path)}</div>
  </div>`;
  loadSnapshots();
}

function renderRollback(res){
  if (!res.ok){
    out.innerHTML = `<div class="panel"><div class="errbox"><div class="t">无法回滚</div>
      <pre>${esc(res.error || "")}</pre></div></div>`;
    return;
  }
  const d = res.diff || {};
  const rows = [];
  (d.changed || []).forEach(f => rows.push(["修改", f]));
  (d.removed || []).forEach(f => rows.push(["新增", f]));
  (d.added || []).forEach(f => rows.push(["删除", f]));
  const sid = (d.snapshot && d.snapshot.id) || "";

  let h = `<div class="panel">
    <div class="p-head"><span class="p-title">回滚预演</span>
      <span class="p-time">${esc(sid)}</span></div>
    <div class="verdict ${d.total_diff ? "warn" : "ok"}">
      与当前目录差异 ${d.total_diff} 个文件${d.total_diff ? "" : "（已一致，无需回滚）"}</div>`;
  if (rows.length){
    h += rows.map(([tag, f]) =>
      `<div style="display:flex;gap:10px;padding:5px 0;font-size:12.5px;border-bottom:1px solid #F7F8FA">
         <span style="width:34px;color:#B45309">${tag}</span>
         <span style="font-family:monospace;color:#475569">${esc(f)}</span></div>`).join("");
    h += `<div style="margin-top:14px;font-size:12px;color:#8A94A6;line-height:1.7">
      预演不写任何文件。确认真实执行请用命令行：<br>
      <code style="background:#F3F5F8;padding:2px 6px;border-radius:4px">python -m deliverkit rollback -t targets/xxx.json --to ${esc(sid)} --apply</code>
      <br>执行前会自动把当前状态再备份一份。</div>`;
  }
  h += "</div>";
  out.innerHTML = h;
}

async function loadSnapshots(){
  try{
    const r = await fetch("/api/snapshots?target=" + encodeURIComponent(current || "retail-nl2sql.json"));
    const d = await r.json();
    const list = d.snapshots || [];
    const el = $("snapInfo");
    if (el) el.textContent = list.length
      ? `${list.length} 个快照 · 最新 ${list[0].id}` : "还没有快照";
  }catch(e){}
}

/* ---------- 执行 ---------- */
async function run(name){
  if (name === "eval"){ return runEvalStream(); }
  document.querySelectorAll(".act, .op").forEach(b => b.disabled = true);
  showLoading(name);
  const t0 = Date.now();
  try{
    const tgt = current || "retail-nl2sql.json";
    const payload = {target: tgt};

    // 回滚需要先知道自己有哪些快照，默认取最新的那个
    if (name === "rollback"){
      const sr = await fetch("/api/snapshots?target=" + encodeURIComponent(tgt));
      const sd = await sr.json();
      const list = sd.snapshots || [];
      if (!list.length){
        stopLoading();
        out.innerHTML = `<div class="panel"><div class="errbox">
          <div class="t">还没有快照</div>
          <pre>先点「创建快照」，之后才能回滚</pre></div></div>`;
        return;
      }
      payload.to = list[0].id;
    }

    const r = await fetch("/api/" + name, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    stopLoading();
    if (d.error){
      out.innerHTML = `<div class="panel"><div class="errbox">
        <div class="t">执行失败</div><pre>${esc(d.error)}\n${esc(d.trace||"")}</pre></div></div>`;
      return;
    }
    const dt = ((Date.now()-t0)/1000).toFixed(1);
    if (name === "check") renderCheck(d.result);
    else if (name === "bundle") renderSteps("离线打包", d.result.steps,
      `部署包 ${d.result.zip} · ${d.result.zip_mb} MB · ${d.result.file_count} 个文件`, true);
    else if (name === "smoke") renderSteps("部署验证", d.result.steps,
      d.result.passed ? "部署成功，服务可正常响应" : "部署未通过", d.result.passed);
    else if (name === "eval") renderEval(d.result);
    else if (name === "all") renderAll(d);
    else if (name === "patrol") renderPatrol(d.result);
    else if (name === "snapshot") renderSnapshot(d.result);
    else if (name === "rollback") renderRollback(d.result);
    if (name === "check" || name === "bundle") loadReports();
  }catch(e){
    stopLoading();
    out.innerHTML = `<div class="panel"><div class="errbox">
      <div class="t">请求异常</div><pre>${esc(e.message)}</pre></div></div>`;
  }finally{
    document.querySelectorAll(".act, .op").forEach(b => b.disabled = false);
  }
}

document.querySelectorAll(".act, .op").forEach(b => {
  b.onclick = () => run(b.dataset.act);
});
$("openDir").onclick = () => fetch("/api/open-dir", {method:"POST"});
$("mClose").onclick = () => $("modal").classList.remove("show");
$("modal").onclick = e => { if (e.target.id === "modal") $("modal").classList.remove("show"); };

loadTargets().then(() => { loadReports(); loadSnapshots(); });
</script>
